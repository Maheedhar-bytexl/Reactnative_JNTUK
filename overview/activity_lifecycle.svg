<svg width="680" height="520" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
<rect width="680" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#495057" stroke-width="1.5"/></marker></defs>
<text x="340" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e1e1e">Activity Lifecycle</text>

<rect x="270" y="50" width="160" height="44" rx="8" fill="#e7f5ff" stroke="#1971c2"/>
<text x="350" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#1971c2">onCreate()</text>
<line x1="350" y1="94" x2="350" y2="124" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="270" y="124" width="160" height="44" rx="8" fill="#e7f5ff" stroke="#1971c2"/>
<text x="350" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#1971c2">onStart()</text>
<line x1="350" y1="168" x2="350" y2="198" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="240" y="198" width="220" height="56" rx="8" fill="#ebfbee" stroke="#2f9e44"/>
<text x="350" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f9e44">onResume() — Running</text>
<text x="350" y="238" text-anchor="middle" font-size="11" fill="#2f9e44">Activity visible &amp; in foreground</text>
<line x1="350" y1="254" x2="350" y2="284" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="270" y="284" width="160" height="44" rx="8" fill="#fff9db" stroke="#f08c00"/>
<text x="350" y="310" text-anchor="middle" font-size="14" font-weight="bold" fill="#f08c00">onPause()</text>
<line x1="350" y1="328" x2="350" y2="358" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="270" y="358" width="160" height="44" rx="8" fill="#fff9db" stroke="#f08c00"/>
<text x="350" y="384" text-anchor="middle" font-size="14" font-weight="bold" fill="#f08c00">onStop()</text>
<line x1="350" y1="402" x2="350" y2="432" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="270" y="432" width="160" height="40" rx="8" fill="#fff5f5" stroke="#e03131"/>
<text x="350" y="456" text-anchor="middle" font-size="14" font-weight="bold" fill="#e03131">onDestroy()</text>

<path d="M470 306 C 590 306, 590 146, 434 146" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="600" y="226" text-anchor="middle" font-size="11" fill="#0F6E56">back to</text>
<text x="600" y="240" text-anchor="middle" font-size="11" fill="#0F6E56">onResume()</text>

<path d="M266 380 C 110 380, 110 146, 266 146" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="90" y="256" text-anchor="middle" font-size="11" fill="#854F0B">onRestart()</text>
<text x="90" y="270" text-anchor="middle" font-size="11" fill="#854F0B">then onStart()</text>
</svg>