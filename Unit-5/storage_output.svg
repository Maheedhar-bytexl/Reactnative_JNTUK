<svg width="720" height="380" viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif"><rect width="720" height="380" fill="#ffffff"/><text x="360" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e1e1e">Internal Storage vs External Storage</text><rect x="40" y="60" width="300" height="280" rx="10" fill="#e7f5ff" stroke="#1971c2"/><text x="190" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#1971c2">Internal Storage</text><rect x="60" y="110" width="260" height="60" rx="6" fill="#ffffff" stroke="#1971c2"/><text x="190" y="132" text-anchor="middle" font-size="10" fill="#1971c2">/data/data/com.campusconnect/</text><text x="190" y="150" text-anchor="middle" font-size="10" fill="#1971c2">files/lost_item_photo_12.jpg</text><text x="60" y="200" font-size="10" fill="#0c447c">• Private to CampusConnect only</text><text x="60" y="220" font-size="10" fill="#0c447c">• Deleted if app is uninstalled</text><text x="60" y="240" font-size="10" fill="#0c447c">• No permission needed</text><text x="60" y="270" font-size="10" font-weight="bold" fill="#1971c2">Used for: Lost &amp; Found photos</text><rect x="380" y="60" width="300" height="280" rx="10" fill="#fff9db" stroke="#f08c00"/><text x="530" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#f08c00">External Storage</text><rect x="400" y="110" width="260" height="60" rx="6" fill="#ffffff" stroke="#f08c00"/><text x="530" y="132" text-anchor="middle" font-size="10" fill="#f08c00">/storage/emulated/0/Download/</text><text x="530" y="150" text-anchor="middle" font-size="10" fill="#f08c00">attendance_report.csv</text><text x="400" y="200" font-size="10" fill="#854F0B">• Visible to other apps (Files, Drive)</text><text x="400" y="220" font-size="10" fill="#854F0B">• Survives app uninstall</text><text x="400" y="240" font-size="10" fill="#854F0B">• Needs storage permission (older APIs)</text><text x="400" y="270" font-size="10" font-weight="bold" fill="#f08c00">Used for: exported attendance report</text></svg>