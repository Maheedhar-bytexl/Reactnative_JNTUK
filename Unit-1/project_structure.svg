<svg width="680" height="360" viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, monospace">
<rect width="680" height="360" fill="#ffffff"/>
<text x="340" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e1e1e" font-family="Arial">CampusConnect — Project Structure</text>
<g font-size="14" fill="#212529">
<text x="40" y="60" font-weight="bold" fill="#1971c2">CampusConnect/</text>
<text x="60" y="85" font-weight="bold" fill="#f08c00">app/</text>
<text x="80" y="108" font-weight="bold" fill="#7048e8">manifests/</text>
<text x="100" y="128" fill="#495057">AndroidManifest.xml   — declares Activities, permissions</text>
<text x="80" y="152" font-weight="bold" fill="#0ca678">java/com/campusconnect/</text>
<text x="100" y="172" fill="#495057">MainActivity.java, HomeActivity.java ...</text>
<text x="80" y="196" font-weight="bold" fill="#2f9e44">res/</text>
<text x="100" y="216" fill="#495057">layout/    — activity_home.xml, fragment_timetable.xml</text>
<text x="100" y="236" fill="#495057">drawable/  — icons, images</text>
<text x="100" y="256" fill="#495057">values/    — strings.xml, colors.xml, themes.xml</text>
<text x="100" y="276" fill="#495057">mipmap/    — app launcher icons</text>
<text x="80" y="300" font-weight="bold" fill="#e03131">Gradle Scripts/</text>
<text x="100" y="320" fill="#495057">build.gradle (Module: app)  — dependencies, SDK versions</text>
<text x="100" y="340" fill="#495057">build.gradle (Project)      — project-wide config</text>
</g>
</svg>